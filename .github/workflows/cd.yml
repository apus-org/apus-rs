name: CD

on:
  push:
    tags: ['v*']

jobs:

  # continuous integration
  CI:
    uses: ./.github/workflows/ci.yml

  # continuous deployment
  #
  # NOTE: `cargo publish` cannot succeed while apus-rs depends on
  # stm32f0xx-hal via git (crates.io tops out at 0.18.0, which lacks the
  # eh-1.0 I2C impl apus-rs uses). This workflow is staged: it goes green
  # once the dependency is a published crates.io version. Until then the
  # publish step fails on tag pushes, by design.
  publish:
    needs: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi
      
      - name: Publish
        run: cargo publish --locked --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
