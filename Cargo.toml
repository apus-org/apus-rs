[package]
name = "apus"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Board-support crate for the APUS board (STM32F072)"
repository = "https://github.com/jakobjung10/apus-rs"
readme = "README.md"
exclude = ["device/"]

[profile.dev]
opt-level = 1

# dependencies: optimization for size
[profile.dev.package."*"]
opt-level = "z"

[profile.release]
debug = 2

[dependencies]
cortex-m = { version = "0.7.7" }
stm32f0xx-hal = { git = "https://github.com/stm32-rs/stm32f0xx-hal.git", features = [
    "stm32f072",
    "stm32-usbd",
] }
critical-section = "1"
embedded-hal = "1.0.0"
embedded-hal-bus = "0.3.0"
embedded-hal-compat = "0.13.0"
inverted-pin = "1.0.0"
embedded-graphics = "0.8.2"
mipidsi = "0.10.0"
lm75 = "1.0.0"
mcp794xx = "0.4.0"
tsc2046 = "0.1.0"
usb-device = "0.2.9"

# eh-1.0 I2C impl pending upstream
[patch."https://github.com/stm32-rs/stm32f0xx-hal.git"]
stm32f0xx-hal = { git = "https://github.com/jakobjung10/stm32f0xx-hal.git", branch = "i2c-eh1" }

[dev-dependencies]
# interrupt handlers in the examples
stm32f0xx-hal = { git = "https://github.com/stm32-rs/stm32f0xx-hal.git", features = ["rt"] }
cortex-m-rt = "0.7.5"
defmt = "1.0"
defmt-rtt = "1.0"
heapless = "0.9.3"
nb = "1.1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
panic-halt = "1.0.0"
# usbd-hid-macros 0.6 accepts any usbd-hid-descriptors, but only 0.1 compiles with it:
# Cargo.lock pins it (cargo update -p usbd-hid-descriptors --precise 0.1.2)
usbd-hid = "0.6.1"
usbd-serial = "0.1.1"
w5500-ll = { version = "0.13.0", features = ["eh1"] }
w5500-hl = "0.12.0"
w5500-dhcp = "0.7.0"
embedded-sdmmc = { version = "0.10.0", default-features = false }
