[package]
name = "apus-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
critical-section = "1"
embedded-graphics = "0.8.1"
embedded-hal = "1.0.0"
embedded-hal-bus = "0.3.0"
embedded-hal-compat = "0.13.0"
inverted-pin = "1.0.0"
lm75 = "1.0.0"
mcp794xx = "0.4.0"
mipidsi = "0.9.0"
# stm32f0xx-hal = { git = "https://github.com/stm32-rs/stm32f0xx-hal.git", rev = "8eda864", features = ["stm32f072"] }
# stm32f0xx-hal = { path = "../stm32f0xx-hal", features = ["stm32f072"] }
stm32f0xx-hal = { git = "https://github.com/jakobjung10/stm32f0xx-hal.git", branch = "gpioe-AF1-reenablement", features = [
    "stm32f072",
] }
tsc2046 = "0.1.0"

[patch."https://github.com/jakobjung10/stm32f0xx-hal.git"]
stm32f0xx-hal = { path = "../../stm32f0xx-hal" }

[dev-dependencies]
cortex-m-rt = "0.7.5"
heapless = "0.7"
panic-halt = "1.0.0"
panic-rtt-target = "0.2.0"
rtt-target = "0.6.2"
