[package]
name = "apus-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
cortex-m-semihosting = "0.5.0"
embedded-graphics = "0.8.1"
embedded-hal = "0.2.7"
embedded-hal-compat = "0.13.0"
inverted-pin = "1.0.0"
mipidsi = "0.9.0"
panic-halt = "1.0.0"
rtt-target = "0.6.1"
stm32f0xx-hal = { version = "0.18.0", features = ["stm32f072"] }
